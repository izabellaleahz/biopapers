name: daily build

on:
  schedule:
    - cron: "0 12 * * *"  # 12:00 UTC daily (~5am PT), after bioRxiv's overnight posting
  workflow_dispatch:
    inputs:
      days:
        description: "Fetch lookback in days (use 30 for a fresh backfill)"
        default: "3"
      x_now:
        description: "Pull X now even if the last pull was under 44h ago (billed)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write  # upload the archive release assets
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75  # first run embeds + scores the whole window; daily runs are ~15 min
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Pull this month's + last month's archive files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view archive >/dev/null 2>&1 || gh release create archive \
            --title "Paper archive" --notes "Every paper the daily build has seen, one gzipped JSONL file per month. Updated daily."
          assets=$(gh release view archive --json assets -q '.assets[].name')
          first=$(date -u +%Y-%m-01)
          for m in $(date -u -d "$first" +%Y-%m) $(date -u -d "$first -1 day" +%Y-%m); do
            f="papers-$m.jsonl.gz"
            # A failed download must fail the job — uploading a partial month would clobber the real one.
            if grep -qx "$f" <<<"$assets"; then gh release download archive -p "$f" -D archive; fi
          done
      - name: Build papers.json (merged with the live site's previous data)
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}  # X recent search, pay-per-use (config/sources.yaml buzz.x)
          X_FORCE: ${{ inputs.x_now && '1' || '' }}      # the x_now input: skip the every-other-day cooldown
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BIOPAPERS_GIST_ID: ${{ vars.BIOPAPERS_GIST_ID }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}  # reads users' PI watchlists
        run: |
          python -m pipeline.build \
            --days "${{ inputs.days || '3' }}" \
            --previous "$SITE_URL/data" \
            --site-url "$SITE_URL/"
      - name: Make sure no secret key is published
        run: |
          # Only the public (publishable) Supabase key belongs in the site; the service key stays a secret.
          if grep -rqE "sb_secret_|service_role" site/; then echo "::error::A secret Supabase key is in site/"; exit 1; fi
      - name: Push archive files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload archive archive/*.jsonl.gz --clobber
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
