name: x probe

# One-off diagnostic of the X buzz search (pipeline/x_probe.py): ~$1-2 of X API usage per run.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python -m pipeline.x_probe
